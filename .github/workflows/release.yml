name: Release

# 推送 v* 标签即三平台并行构建并发布 Release。
# 手动触发（workflow_dispatch）只做构建验证，不创建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 单平台失败不连累其它平台，便于只重跑失败的那个
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            script: build:mac
            artifacts: |
              dist/*.dmg
              dist/*.pkg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          # Windows 包必须在 windows runner 上打：
          # cbor-extract 没有 win32 预编译产物以外的可用组合，交叉编译会失败
          - label: Windows
            os: windows-latest
            script: build:win
            artifacts: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - label: Linux
            os: ubuntu-latest
            script: build:linux
            artifacts: |
              dist/*.AppImage
              dist/latest-linux.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 需 >= 22.19：undici 8 / chalk 6 / electron-store 12 的最低要求
          node-version: 22.19
          cache: npm

      # 兜底：任何依赖触发 node-gyp 时都需要 distutils，
      # runner 自带的 Python 3.12+ 已移除它，靠 setuptools 补回来
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备构建工具链
        run: python -m pip install --upgrade setuptools

      - name: 安装依赖
        run: npm ci

      # --publish never：产物统一交给下面的 release job 上传，
      # 避免 electron-builder 在 CI 检测到 tag 时自行创建重复的 Release
      - name: 打包
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成发布说明
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 只取 CHANGELOG 里当前版本那一段，避免把历史日志全塞进说明。
          # 同时跳过底部链接定义，以及每版重复的「安装遇到问题」入口行——
          # 后者统一放到说明最底部（见下方），并用绝对链接，避免夹在下载表上方且无法点击。
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && /^\[.*\]: http/ { next }
            flag && /^> *安装遇到问题/ { next }
            flag { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "本次发布未在 CHANGELOG.md 中找到 $version 的条目。" > NOTES.md
          fi
          # 下载表的「快捷下载」列：直链指向本次 Release 的附件，用户不必再去 Assets 里翻。
          # 文件名取自 artifacts 里实际要上传的文件，不手写版本号与包名；
          # 找不到就让这一步失败，免得发出一份带失效链接的说明（通常是改了 electron-builder.yml 的 artifactName）
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          pick() {
            for f in artifacts/*"$1"; do
              [ -f "$f" ] && { echo "${f##*/}"; return 0; }
            done
            echo "::error::artifacts 里没有 *$1，发布说明的下载链接与 electron-builder.yml 的 artifactName 对不上" >&2
            return 1
          }
          mac_arm_pkg=$(pick -mac-arm64.pkg)
          mac_arm_dmg=$(pick -mac-arm64.dmg)
          mac_x64_pkg=$(pick -mac-x64.pkg)
          mac_x64_dmg=$(pick -mac-x64.dmg)
          win_exe=$(pick -win-x64-setup.exe)
          linux_appimage=$(pick -linux-x86_64.AppImage)
          # link 名称 文件名
          link() { printf '[%s](%s/%s)' "$1" "$base" "$2"; }
          # row 平台 文件 快捷下载
          row() { printf '| %s | %s | %s |\n' "$1" "$2" "$3"; }
          {
            printf '\n## 📦 下载\n\n'
            row '平台' '文件' '快捷下载'
            row '---' '---' '---'
            row 'macOS (Apple Silicon)' '`*-mac-arm64.pkg`（推荐）或 `*-mac-arm64.dmg`' \
              "$(link '.pkg 安装包（推荐）' "$mac_arm_pkg") · $(link '.dmg 镜像' "$mac_arm_dmg")"
            row 'macOS (Intel)' '`*-mac-x64.pkg`（推荐）或 `*-mac-x64.dmg`' \
              "$(link '.pkg 安装包（推荐）' "$mac_x64_pkg") · $(link '.dmg 镜像' "$mac_x64_dmg")"
            row 'Windows' '`*-win-x64-setup.exe`' "$(link '.exe 安装包' "$win_exe")"
            row 'Linux' '`*-linux-x86_64.AppImage`' "$(link '.AppImage' "$linux_appimage")"
          } >> NOTES.md
          cat >> NOTES.md <<'EOF'

          macOS 推荐用 `.pkg`：双击按向导安装，装好后打开应用不会再提示「已损坏」。
          安装包未做签名与公证，首次双击 `.pkg` 若被拦截，请在「系统设置 - 隐私与安全性」中点击「仍要打开」。

          ---

          > 安装遇到问题？请查看 [安装说明与常见问题](https://github.com/lucks-cloud/kiro-manager-lite/blob/main/INSTALL.md)。
          EOF

      - name: 删除同标签旧 Release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: context.ref.replace('refs/tags/', '')
              })
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              })
              core.info(`已删除旧 Release：${release.tag_name}`)
            } catch (error) {
              if (error.status !== 404) throw error
              core.info('未找到同标签旧 Release，继续首次发布')
            }

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: NOTES.md
          files: artifacts/**
          fail_on_unmatched_files: true
